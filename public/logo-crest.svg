<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" fill="none">
  <!-- Crest Shield -->
  <g transform="translate(10, 10)">
    <defs>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E5C77D" />
        <stop offset="50%" stop-color="#C09D59" />
        <stop offset="100%" stop-color="#8F7132" />
      </linearGradient>
      <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#D91E42" />
        <stop offset="50%" stop-color="#B90124" />
        <stop offset="100%" stop-color="#730014" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C09D59" flood-opacity="0.3"/>
      </filter>
    </defs>
    
    <!-- Shield Outer with Gold Border -->
    <path d="M40 2 L68 14 C68 52 40 74 40 76 C40 74 12 52 12 14 Z" fill="url(#crimsonGrad)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow)"/>
    
    <!-- Inner Shield Accent Line -->
    <path d="M40 8 L62 18 C62 48 40 67 40 68 C40 67 18 48 18 18 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" stroke-dasharray="2 1"/>
    
    <!-- Open Book Symbol (Academics) -->
    <path d="M26 48 C30 45 36 45 40 48 C44 45 50 45 54 48 L54 36 C50 33 44 33 40 36 C36 33 30 33 26 36 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Torch Flame (Knowledge) -->
    <path d="M40 20 C42 24 45 26 44 30 C43 32 41 33 40 33 C39 33 37 32 36 30 C35 26 38 24 40 20 Z" fill="url(#goldGrad)"/>
    
    <!-- Small Laurel Stars -->
    <circle cx="28" cy="22" r="1.5" fill="#E5C77D"/>
    <circle cx="52" cy="22" r="1.5" fill="#E5C77D"/>
    
    <!-- Modern Gurukul Ribbon -->
    <rect x="18" y="70" width="44" height="9" rx="3" fill="#15171E" stroke="url(#goldGrad)" stroke-width="1"/>
    <text x="40" y="77" fill="#E5C77D" font-family="'Cinzel', serif" font-size="5" font-weight="700" text-anchor="middle" letter-spacing="0.5">EST. 2012</text>
  </g>

  <!-- Typography Brand Text -->
  <g transform="translate(100, 24)">
    <text x="0" y="24" fill="#B90124" class="dark:fill-[#E63956]" font-family="'Cinzel', 'Playfair Display', serif" font-size="24" font-weight="800" letter-spacing="1.5">TULA'S</text>
    <text x="0" y="44" fill="#1C1C1C" class="dark:fill-[#F3F4F6]" font-family="'Outfit', sans-serif" font-size="12.5" font-weight="700" letter-spacing="4">INTERNATIONAL SCHOOL</text>
    <text x="0" y="58" fill="#C09D59" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.5">DEHRADUN • THE MODERN GURUKUL</text>
  </g>
</svg>
